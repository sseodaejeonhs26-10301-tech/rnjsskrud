<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>성평등할끄니까</title>
<style>
  *{box-sizing:border-box} body{font-family:system-ui,'Malgun Gothic',sans-serif;max-width:800px;margin:0 auto;padding:24px 20px;background:#f5f6fc;color:#25243b;line-height:1.75}
  h1{text-align:center;margin-bottom:0}
  .sub{text-align:center;color:#666;margin-top:4px}

  .row{display:flex;gap:10px}.row button{flex:1;padding:28px 8px;font-size:1.1rem}
  .card{background:#fff;border-radius:12px;padding:14px;margin:10px 0;box-shadow:0 1px 4px #0002}
  .choice{display:block;width:100%;text-align:left;background:#fff;color:#222;border:2px solid #d8ccff}
  .err{color:#d32f2f}
  .bar{height:18px;border-radius:4px;margin:2px 0;color:#fff;font-size:.8rem;padding-left:6px;box-sizing:border-box;white-space:nowrap}

  small{color:#777}
  .scale label{margin-right:8px}
  header{padding:16px 0 24px} .badge{display:table;margin:auto;background:#e6e1ff;color:#5033ab;padding:3px 12px;border-radius:30px;font-weight:700;font-size:.875rem}
  button,a.button{min-height:46px;font-weight:600;transition:background .15s} button:hover{filter:brightness(.94)} button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #136761;outline-offset:3px}
  nav{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px} nav button{background:white;color:#5033ab;border:1px solid #d8ccff;flex:1;padding:9px}
  .card{padding:22px;border:1px solid #e5e2ef;box-shadow:none;margin:16px 0} .row button{min-height:120px}.choice{padding:16px;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  fieldset{border:0;padding:16px 0;margin:0;border-bottom:1px solid #e5e2ef} legend{padding-top:16px;font-weight:600}.scale{display:flex;justify-content:space-between;gap:6px}.scale label{flex:1;text-align:center;margin:0;padding:10px 0;border-radius:8px;background:#f2effb;cursor:pointer}.scale input{accent-color:#6941c6}
  small,.muted{color:#605d70}small{font-size:.875rem} h2{line-height:1.4}h3{font-size:1.05rem}.bar{height:12px;padding:0;margin:4px 0 12px}.f{background:#7054c9}.m{background:#168278}.track{background:#eeeaf5;border-radius:4px}.bar-label{display:flex;justify-content:space-between;font-size:.9rem}
  progress{width:100%;height:12px;accent-color:#7054c9}.quote{font-size:1.1rem;border-left:4px solid #7054c9;padding-left:16px}.button{display:inline-block;background:#6941c6;color:white;border-radius:10px;padding:9px 16px;text-decoration:none;margin:8px 8px 0 0}a{color:#5033ab}footer{text-align:center;color:#605d70;font-size:.875rem;margin:32px 0} .score{font-size:1.8rem;color:#5033ab}.err{font-weight:600}#app:focus{outline:none}
  @media(max-width:480px){body{padding:12px}h1{font-size:1.8rem}.card{padding:16px}.grid{grid-template-columns:1fr}.row{gap:8px}.row button{font-size:1rem;padding:18px 8px}.scale label{padding:12px 0}}
</style>
</head>
<body>
<header><span class="badge">SDGs 5 · 성평등</span><h1>성평등할끄니까</h1>
<p class="sub">상황극으로 배우는 성평등</p>
</header><main id="app" tabindex="-1"></main><footer>함께 생각하고, 더 나은 표현을 찾아요.<br>기획 · 권나경</footer>

<script>
// ───── 데이터 ─────
const QUESTIONS = [
  "친구의 외모를 농담으로 놀리는 건 문제가 될 수 있다고 생각한다.",
  "'남자는 울면 안 된다' 같은 말은 차별적인 고정관념이라고 생각한다.",
  "'그냥 농담이야'라고 해도 상대가 불편하면 성희롱이 될 수 있다고 생각한다."
];

// 선택지 점수: 0~10점
const PLACES = {
  "학교": [
    { text: "모둠 활동 중 친구가 남학생에게 \"남자가 왜 이렇게 꼼꼼해? 여자 같네\"라고 말했다.",
      choices: [
        { t: "웃으며 넘어간다", s: 2, why: "넘어가면 그 말이 괜찮다는 신호가 될 수 있어요. 불편함을 표현하는 편이 더 좋아요." },
        { t: "\"그 말은 불편해, 성별이랑 상관없잖아\"라고 말한다", s: 10, why: "상대를 탓하기보다 내 감정과 기준을 차분히 말해 가장 좋은 대처예요." },
        { t: "나중에 선생님께 따로 말씀드린다", s: 7, why: "직접 말하기 어려울 때 좋은 방법이에요. 혼자 참지 않는 게 중요해요." }
      ], tip: ["그 말은 불편해, 성별이랑 상관없잖아.", "꼼꼼한 건 성격이지 성별이 아니야."] },
    { text: "쉬는 시간, 울고 있는 남학생에게 친구가 \"남자가 울면 안 되지\"라고 말했다.",
      choices: [
        { t: "같이 웃는다", s: 0, why: "감정 표현을 막는 고정관념을 강화할 수 있어요." },
        { t: "\"누구나 울 수 있어. 괜찮아?\"라고 말한다", s: 10, why: "고정관념을 바로잡으면서 친구를 챙기는 좋은 대처예요." },
        { t: "모르는 척 지나간다", s: 3, why: "마음은 알지만, 작은 한마디가 큰 힘이 될 수 있어요." }
      ], tip: ["누구나 울 수 있어. 괜찮아?", "울고 싶을 땐 울어도 돼."] }
  ],
  "가정": [
    { text: "명절에 친척이 \"설거지는 여자애가 해야지\"라며 딸에게만 시켰다.",
      choices: [
        { t: "말없이 한다", s: 2, why: "참으면 불편함이 전달되지 않아요." },
        { t: "\"집안일은 성별이 아니라 다 같이 나눠서 하면 좋겠어요\"라고 말한다", s: 10, why: "공손하게 기준을 제안해 거부감을 줄여요." },
        { t: "부모님께 나중에 이야기한다", s: 7, why: "어른과 직접 말하기 어려울 때 좋은 방법이에요." }
      ], tip: ["집안일은 다 같이 나눠서 하면 좋겠어요.", "저도 하고, 오빠(동생)도 같이 하면 어때요?"] }
  ],
  "알바": [
    { text: "아르바이트 사장님이 \"남자가 그것도 못 들어?\"라며 무거운 짐을 남자 직원에게만 시킨다.",
      choices: [
        { t: "힘들어도 참고 든다", s: 2, why: "성별 때문에 일이 몰리는 것도 차별일 수 있어요." },
        { t: "\"같이 나눠서 들면 더 안전하고 빠를 것 같아요\"라고 말한다", s: 10, why: "안전과 효율을 근거로 제안해 설득력이 높아요." },
        { t: "그냥 그만둔다", s: 3, why: "그만두기 전에 말해 보거나 도움 기관에 상담해 보세요." }
      ], tip: ["같이 나눠서 들면 더 안전하고 빠를 것 같아요.", "성별과 상관없이 일을 나눠 주세요."] }
  ],
  "대중교통": [
    { text: "버스에서 모르는 사람이 계속 몸을 밀착해 불편하다.",
      choices: [
        { t: "참고 있는다", s: 1, why: "불편하면 참지 않아도 돼요. 안전이 먼저예요." },
        { t: "자리를 옮기고 기사님이나 주변 사람에게 도움을 요청한다", s: 10, why: "안전을 확보하고 도움을 요청하는 가장 좋은 대처예요." },
        { t: "휴대폰으로 112에 문자 신고한다", s: 9, why: "소리 내기 어려울 때 효과적인 방법이에요." }
      ], tip: ["지금 불편해요. 떨어져 주세요.", "도와주세요, 저 사람이 계속 밀착해요."] }
  ],
  "SNS": [
    { text: "단톡방에서 친구가 같은 반 친구의 외모를 성적으로 놀리는 사진을 올렸다.",
      choices: [
        { t: "웃음 이모티콘을 보낸다", s: 0, why: "가담하는 것처럼 보일 수 있고 피해자가 더 상처받아요." },
        { t: "\"그건 장난이 아니라 불편한 행동이야, 지워줘\"라고 말한다", s: 10, why: "행동을 짚고 대안을 말하는 좋은 대처예요." },
        { t: "캡처해 두고 선생님이나 상담 기관에 알린다", s: 9, why: "증거를 남겨 도움을 받는 안전한 방법이에요." }
      ], tip: ["그건 장난이 아니라 불편한 행동이야, 지워줘.", "이런 사진은 올리지 말자."] }
  ]
};

// 공식 안내와 조사 자료를 화면에 함께 연결합니다. 외부 API 없이 작동합니다.
const SOURCE = "https://www.mogef.go.kr/nw/enw/nw_enw_s001d.do?bbtSn=710092&mid=mda700";
const CHARTS = [
  {title:"결과 · 월평균 임금 수준", f:64.8, m:100, unit:"", note:"2024년 남성 100 기준. 여성 285만 원, 남성 440만 원. 근로시간·직종 등의 차이를 통제하지 않은 전체 격차로, 같은 일을 할 때의 임금 차이를 뜻하지 않아요.", source:"국회예산정책처, 2024회계연도 성인지 결산서 분석 (고용형태별근로실태조사 인용)", url:"https://www.nabo.go.kr/board/file/down.do?fid=33318694"},
  {title:"경험 · 직장 또는 학교에서 겪은 외모차별", f:4.9, m:3.7, unit:"%", note:"2021년 양성평등 실태조사. 외모차별 경험 비율이며, 모든 성차별 경험의 비율을 뜻하지 않아요.", source:"여성가족부, 2021년 양성평등 실태조사 · 건강 항목",url:SOURCE},
  {title:"생각 · ‘가족 생계는 주로 남성 책임’에 동의", f:9.6, m:17.5, unit:"%",note:"2021년 양성평등 실태조사 중 20대 응답. 전체 연령의 응답과 구별해서 읽어요.",source:"여성가족부, 2021년 양성평등 실태조사 · 성평등의식 항목",url:SOURCE}
];
const HELP = [
  {name:"학교 상담실 · Wee클래스",desc:"학교 운영 시간 내 상담 가능 여부를 확인하세요. 상담 선생님이나 믿을 수 있는 교직원에게 이야기해요."},
  {name:"청소년상담 1388",desc:"청소년과 보호자 · 성별 관계없이 이용 · 365일 24시간. 휴대전화는 지역번호+1388로 연결할 수 있어요.",tel:"1388",url:"https://www.1388.go.kr/cco/YTOSP_SC_CCI_01"},
  {name:"여성긴급전화 1366",desc:"폭력 피해 여성의 긴급 상담·보호 및 전문기관 연계 · 365일 24시간",tel:"1366",url:"https://www.mogef.go.kr/cc/wcc/cc_wcc_f001.do"}
];
// 점수는 학습 피드백입니다. 피해자가 즉시 대응하지 못한 책임을 묻지 않습니다.
for (const scenes of Object.values(PLACES)) {
  for (const scene of scenes) {
    scene.choices[0].why = /같이 웃|이모티콘/.test(scene.choices[0].t)
      ? "웃음으로 동조하면 상대가 상처받고 이런 표현이 반복될 수 있어요. 성별 대신 행동을 이야기하고, 안전한 방법으로 친구를 도와요."
      : "바로 말하기 어렵거나 몸이 굳는 것은 자연스러운 반응이에요. 피해는 내 잘못이 아니에요. 안전해진 뒤 믿을 수 있는 사람에게 도움을 요청할 수 있어요.";
  }
}
PLACES['알바'][0].choices[2] = {t:"안전한 곳으로 이동해 믿을 수 있는 어른에게 도움을 요청한다",s:10,why:"위험한 일을 멈추고 지원을 구하는 것도 좋은 대처예요. 직접 설득해야 할 의무는 없어요."};
PLACES['SNS'][0].choices[2] = {t:"게시물 주소·시간을 기록하고 선생님이나 상담 기관에 알린다",s:10,why:"도움을 요청하고 플랫폼에 신고할 수 있어요. 성적인 사진은 다시 전송하거나 공유하지 말고, 증거 보존 방법을 상담 기관에 물어보세요."};
PLACES['학교'][0].choices[2].s = 10;
QUESTIONS[2] = "직접 말하기 어렵다면 안전한 곳에서 도움을 요청할 수 있다고 생각한다.";
const KEY = 'sdgs-equality-v1';
let state = {pre:null,post:null,answers:{}};
let storageOK = true;
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  const valid = a => Array.isArray(a) && a.length===QUESTIONS.length && a.every(n=>Number.isInteger(n)&&n>=1&&n<=5);
  if(saved && valid(saved.pre)) {
    state.pre = saved.pre;
    if(valid(saved.post)) state.post = saved.post;
    for(const [key,value] of Object.entries(saved.answers||{})) {
      const [p,i] = key.split(':');
      if(PLACES[p]?.[i]?.choices[value] && Number.isInteger(value)) state.answers[key]=value;
    }
  }
} catch { storageOK = false; }
let place=null, idx=0;
const app=document.getElementById('app');
const avg=a=>(a.reduce((sum,n)=>sum+n,0)/a.length).toFixed(1);
const allDone=()=>Object.keys(PLACES).every(p=>placeDone(p));
const placeDone=p=>PLACES[p].every((_,i)=>state.answers[p+':'+i]!==undefined);
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;}}
function show(html){
  app.innerHTML=`${state.pre ? `<nav aria-label="주 메뉴"><button onclick="home()">홈</button><button onclick="placeList()">상황극 게임</button><button onclick="learn()">성차별 알아보기</button><button onclick="helpPage()">도움받기</button></nav>`:''}${html}${!storageOK?'<p role="status">브라우저 저장을 사용할 수 없어 이번 실행 중에만 기록이 유지돼요.</p>':''}`;
  window.scrollTo(0,0); app.focus();
}
function home(){
  const count=Object.keys(PLACES).filter(placeDone).length;
  show(`<h2>일상 속 한마디, 함께 생각해 볼까요?</h2><p class="muted">누가 잘못했는지보다 어떻게 말하면 더 좋을지 배워요.</p>
    <div class="row"><button onclick="placeList()">🎭 상황극 게임</button><button class="sec" onclick="learn()">📚 성차별 알아보기</button></div>
    <div class="card"><b>나의 학습 기록</b><p>완료한 장소 ${count} / 5</p><progress value="${count}" max="5" aria-label="완료한 장소 ${count}개"></progress>
    ${allDone()?`<button onclick="${state.post?'result()':"survey('post')"}">${state.post?'생각의 변화 보기':'마무리 설문 하기'}</button>`:'<p class="muted">다섯 장소의 상황극을 끝내면 생각의 변화를 확인할 수 있어요.</p>'}</div>
    <p><small>응답과 진행 기록은 이 브라우저에만 저장돼요. 이름이나 연락처는 수집하지 않아요.</small></p><button class="sec" onclick="resetPage()">기록 지우고 처음부터</button>`);
}
function survey(kind){
  if(kind==='post'&&!allDone()){placeList();return;}
  show(`<div class="card"><h2>${kind==='pre'?'시작 전, 나의 생각':'마무리, 지금의 생각'}</h2><p>같은 질문 3개로 나의 생각을 돌아봐요. 솔직하게 답해 주세요.</p>
    <p class="muted">1 전혀 아니다 · 2 아니다 · 3 보통이다 · 4 그렇다 · 5 매우 그렇다</p>
    <form onsubmit="event.preventDefault();submitSurvey('${kind}')" novalidate>
    ${QUESTIONS.map((q,i)=>`<fieldset><legend>${i+1}. ${q}</legend><div class="scale">${[1,2,3,4,5].map(n=>`<label><input type="radio" name="q${i}" value="${n}" aria-label="${n}점"> ${n}</label>`).join('')}</div></fieldset>`).join('')}
    <p id="err" class="err" role="alert"></p><button type="submit">${kind==='pre'?'학습 시작하기':'생각의 변화 확인'}</button></form></div>
    ${kind==='pre'?'<button class="sec" onclick="helpPage()">도움이 먼저 필요해요</button>':''}`);
}
function submitSurvey(kind){
  const vals=QUESTIONS.map((_,i)=>Number(document.querySelector(`input[name="q${i}"]:checked`)?.value)||null);
  if(vals.includes(null)){document.getElementById('err').textContent='아직 답하지 않은 질문이 있어요.';document.querySelector(`input[name="q${vals.indexOf(null)}"]`).focus();return;}
  if(kind==='post'&&!allDone())return;
  state[kind]=vals;save();kind==='pre'?home():result();
}
function placeList(){
  if(!state.pre){survey('pre');return;}
  show(`<h2>어디에서 시작할까요?</h2><p>장소마다 상황을 읽고 나의 대처를 선택해요. 순서는 자유예요.</p><div class="grid">${Object.keys(PLACES).map(p=>`<button class="choice" onclick="startPlace('${p}')">${p} <small>· ${PLACES[p].length}개 상황 · ${placeDone(p)?'완료':'체험하기'}</small></button>`).join('')}</div>${allDone()?`<button onclick="${state.post?'result()':"survey('post')"}">${state.post?'생각의 변화 보기':'마무리 설문 하기'}</button>`:''}`);
}
function startPlace(p){place=p;idx=0;scene();}
function scene(){
  const s=PLACES[place][idx];
  show(`<p class="muted">${place} · ${idx+1} / ${PLACES[place].length}</p><h2>이럴 때, 어떻게 하면 좋을까요?</h2><div class="card"><p>${s.text}</p></div>${s.choices.map((c,i)=>`<button class="choice" onclick="pick(${i})">${c.t}</button>`).join('')}<p><small>안전이 가장 먼저예요. 직접 말하기 어려우면 도움을 요청해도 괜찮아요.</small></p>`);
}
function pick(i){
  const s=PLACES[place][idx],c=s.choices[i];
  state.answers[place+':'+idx]=i;save();feedback();
}
function feedback(){
  const s=PLACES[place][idx],c=s.choices[state.answers[place+':'+idx]];
  const last=idx===PLACES[place].length-1;
  show(`<h2>함께 생각해 봐요</h2><div class="card"><b class="score">${c.s} / 10점</b><p>${c.why}</p><small>학습용 선택 점수이며 실제 피해자의 대응을 평가하는 기준이 아니에요.</small></div>
    <div class="card"><h3>이럴 땐 이렇게 말해 보세요</h3>${s.tip.map(t=>`<p class="quote">“${t}”</p>`).join('')}<small>안전하다고 느낄 때만 말해도 괜찮아요.</small></div>
    <button onclick="${last?"finishPlace()":"nextScene()"}">${last?'장소 체험 마치기':'다음 상황'}</button><button class="sec" onclick="helpPage(true)">혼자 해결하기 어려워요</button>`);
}
function nextScene(){idx++;scene();}
function finishPlace(){if(allDone()&&!state.post)survey('post');else placeList();}
function helpPage(back=false){
  show(`<h2>혼자 해결하지 않아도 괜찮아요</h2><p>안전한 곳으로 이동한 뒤 믿을 수 있는 어른에게 상황을 말해요. 바로 대응하지 못했어도 내 잘못이 아니에요.</p>
    ${HELP.map(h=>`<div class="card"><h3>${h.name}</h3><p>${h.desc}</p>${h.tel?`<a class="button" href="tel:${h.tel}">${h.tel} 전화하기</a>`:''}${h.url?`<a href="${h.url}" target="_blank" rel="noopener noreferrer">공식 안내</a>`:''}</div>`).join('')}
    <p>기록을 남기는 일보다 내 안전이 먼저예요. 디지털 피해는 게시물 주소·시간을 기록하고 상담 기관에 증거 보존 방법을 물어봐요. 사진을 다시 공유하지 않아요.</p><p><small>기관 안내 확인일: 2026. 11. 24. 외부 사이트와 전화 연결에는 네트워크·기기 지원이 필요해요.</small></p>
    <button onclick="${back?'feedback()':state.pre?'home()':"survey('pre')"}">${back?'상황극 결과로 돌아가기':'돌아가기'}</button>`);
}
function result(){
  if(!state.post||!allDone()){placeList();return;}
  const before=avg(state.pre),after=avg(state.post),diff=(Number(after)-Number(before)).toFixed(1);
  show(`<h2>내 생각의 변화</h2><div class="card"><p>시작 전 <b class="score">${before}점</b> → 끝난 뒤 <b class="score">${after}점</b></p><p>평균 변화 ${Number(diff)>0?'+':''}${diff}점</p></div>
    ${QUESTIONS.map((q,i)=>`<div class="card"><b>${q}</b><p>${state.pre[i]}점 → ${state.post[i]}점</p></div>`).join('')}
    <p class="muted">모든 문항은 1~5점이고 같은 방향으로 계산해요. 점수가 높을수록 각 문장에 더 동의한다는 뜻이에요. 이 설문은 나의 생각을 돌아보는 활동이며 교육 효과를 객관적으로 입증하는 검사는 아니에요.</p><button onclick="home()">홈으로</button>`);
}
function learn(){
  show(`<h2>성이란 무엇인가?</h2><div class="card"><h3>생물학적 성 (sex)</h3><p>염색체, 호르몬, 생식기관 등 신체적 성 특성과 관련된 개념이에요. 신체적 특성에는 개인차와 다양성이 있어요.</p><h3>사회적 성 (젠더)</h3><p>사회에서 성별에 따라 기대하는 역할과 행동 등을 뜻해요. ‘남자는 씩씩해야 해’, ‘돌봄은 여성의 일’ 같은 기대는 배워 온 고정관념일 수 있어요.</p><p>좋아하는 색, 직업, 성격과 감정은 성별로 정해지지 않아요.</p></div>
    <h2>통계로 보는 일상</h2><p>여성과 남성을 같은 0~100 눈금으로 비교해요. 서로 다른 질문과 조사 대상을 구별해서 읽어요.</p>
    ${CHARTS.map(c=>`<div class="card"><h3>${c.title}</h3>${[['여성',c.f,'f'],['남성',c.m,'m']].map(([label,value,cls])=>`<div class="bar-label"><span>${label}</span><b>${value}${c.unit}</b></div><div class="track"><div class="bar ${cls}" style="width:${value}%"></div></div>`).join('')}<p>${c.note}</p><small>출처: <a href="${c.url}" target="_blank" rel="noopener noreferrer">${c.source}</a></small></div>`).join('')}
    <h2>왜 이런 편견이 생겼을까?</h2>
    <div class="card"><h3>유리천장</h3><p>능력이 있어도 성별 등 때문에 높은 직위로 올라가기 어려운 보이지 않는 장벽이에요. ‘리더는 남성’이라는 오랜 역할 기대와 불공정한 평가·기회 배분 등이 영향을 줄 수 있어요.</p><h3>남성에게도 부담이 되는 고정관념</h3><p>‘남자는 울면 안 된다’, ‘남성이 생계를 책임져야 한다’는 기대는 감정을 표현하거나 육아휴직을 쓰기 어렵게 만들 수 있어요. 전통적인 역할 구분과 반복되는 주변의 말이 이런 편견을 이어 가요.</p><h3>페미니즘</h3><p>성차별을 없애고 성별에 관계없이 평등한 권리와 기회를 추구하는 생각과 움직임이에요.</p></div>
    <div class="card"><h3>학생과 선생님, 함께 이야기해요</h3><p>“남자가 왜 이렇게 꼼꼼해?” 대신 “꼼꼼하게 정리해 줘서 고마워”라고 말해 볼까요? 성별을 빼고 행동 자체를 표현하는 연습을 해요.</p></div><button onclick="placeList()">상황극 게임 하기</button>`);
}
function resetPage(){show(`<div class="card"><h2>학습 기록을 지울까요?</h2><p>이 브라우저에 저장한 설문 응답과 상황극 기록이 삭제돼요.</p><button onclick="resetAll()">기록 삭제</button><button class="sec" onclick="home()">취소</button></div>`);}
function resetAll(){try{localStorage.removeItem(KEY);}catch{storageOK=false;}state={pre:null,post:null,answers:{}};place=null;idx=0;survey('pre');}
state.pre?home():survey('pre');
</script>
</body>
</html>
